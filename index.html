<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIME CAPSULE</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #080b18, #17123b, #071d2b);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 650px;
  text-align: center;
}

h1 {
  font-size: 42px;
  margin-bottom: 8px;
}

.subtitle {
  color: #bfc5ff;
  margin-bottom: 30px;
}

.card {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 22px;
  padding: 25px;
  backdrop-filter: blur(12px);
  box-shadow: 0 20px 60px rgba(0,0,0,0.35);
}

textarea,
input {
  width: 100%;
  padding: 15px;
  margin: 10px 0;
  border: none;
  border-radius: 12px;
  background: rgba(255,255,255,0.1);
  color: white;
  outline: none;
  font-size: 16px;
}

textarea {
  height: 160px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 12px;
  background: #6c63ff;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #8179ff;
}

.hidden {
  display: none;
}

.lock {
  font-size: 55px;
}

.id {
  background: rgba(0,0,0,0.25);
  padding: 12px;
  border-radius: 10px;
  margin: 15px 0;
  word-break: break-all;
}

.countdown {
  font-size: 22px;
  font-weight: bold;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

  <h1>⏳ TIME CAPSULE</h1>

  <div class="subtitle">
    Kelajakdagi o‘zingga xat qoldir
  </div>

  <div class="card" id="createBox">

    <textarea id="message"
      placeholder="Kelajakdagi o‘zingga xat yoz..."></textarea>

    <input id="date" type="date">

    <button onclick="createCapsule()">
      🔐 Kapsula yaratish
    </button>

  </div>

  <div class="card hidden" id="capsuleBox">

    <div class="lock">🔒</div>

    <h2>Kapsula qulflangan</h2>

    <p>Ochilish sanasi:</p>

    <h3 id="openDate"></h3>

    <div class="countdown" id="countdown"></div>

    <p>📦 Kapsula ID:</p>

    <div class="id" id="capsuleId"></div>

    <button onclick="copyId()">
      📋 ID nusxalash
    </button>

  </div>

</div>

<script>

let timer;

function generateId() {
  return "TC-" +
    Math.random().toString(36).substring(2, 8).toUpperCase() +
    "-" +
    Date.now().toString().slice(-5);
}

function createCapsule() {

  const message = document.getElementById("message").value;
  const date = document.getElementById("date").value;

  if (!message.trim()) {
    alert("Avval xat yozing!");
    return;
  }

  if (!date) {
    alert("Ochilish sanasini tanlang!");
    return;
  }

  const selectedDate = new Date(date + "T00:00:00");

  if (selectedDate <= new Date()) {
    alert("Kelajakdagi sanani tanlang!");
    return;
  }

  const id = generateId();

  localStorage.setItem("capsuleMessage", message);
  localStorage.setItem("capsuleDate", selectedDate.getTime());
  localStorage.setItem("capsuleId", id);

  showCapsule();
}

function showCapsule() {

  const date = Number(localStorage.getItem("capsuleDate"));
  const id = localStorage.getItem("capsuleId");

  if (!date || !id) return;

  document.getElementById("createBox").classList.add("hidden");
  document.getElementById("capsuleBox").classList.remove("hidden");

  const openDate = new Date(date);

  document.getElementById("openDate").textContent =
    openDate.toLocaleDateString("uz-UZ");

  document.getElementById("capsuleId").textContent = id;

  clearInterval(timer);

  timer = setInterval(function() {

    const now = new Date().getTime();
    const distance = date - now;

    if (distance <= 0) {

      clearInterval(timer);

      document.getElementById("countdown").textContent =
        "🎉 Kapsula ochildi!";

      return;
    }

    const days = Math.floor(
      distance / (1000 * 60 * 60 * 24)
    );const hours = Math.floor(
      (distance / (1000 * 60 * 60)) % 24
    );

    const minutes = Math.floor(
      (distance / (1000 * 60)) % 60
    );

    const seconds = Math.floor(
      (distance / 1000) % 60
    );

    document.getElementById("countdown").textContent =
      ⏳ ${days} kun ${hours} soat ${minutes} daqiqa ${seconds} soniya;

  }, 1000);
}

function copyId() {

  const id = document.getElementById("capsuleId").textContent;

  navigator.clipboard.writeText(id);

  alert("Kapsula ID nusxalandi!");
}

window.onload = function() {
  showCapsule();
};

</script>

</body>
</html>
