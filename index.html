<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIME CAPSULE</title>

<style>
body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  background: #0b1020;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  max-width: 600px;
  margin: 50px auto;
}

.card {
  background: #171d32;
  padding: 25px;
  border-radius: 20px;
}

textarea,
input {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  box-sizing: border-box;
  border-radius: 10px;
  border: none;
  font-size: 16px;
}

textarea {
  height: 150px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  background: #6c63ff;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

.hidden {
  display: none;
}

#countdown {
  font-size: 20px;
  margin: 20px 0;
}

.id {
  background: #0b1020;
  padding: 12px;
  border-radius: 8px;
  word-break: break-all;
}
</style>
</head>

<body>

<div class="container">

<h1>⏳ TIME CAPSULE</h1>
<p>Kelajakdagi o‘zingga xat qoldir</p>

<div class="card" id="create">

<textarea id="message" placeholder="Kelajakdagi o‘zingga xat yoz..."></textarea>

<input type="date" id="date">

<button id="createButton">🔐 Kapsula yaratish</button>

</div>

<div class="card hidden" id="result">

<div style="font-size:55px;">🔒</div>

<h2>Kapsula qulflangan</h2>

<p>Ochilish sanasi:</p>

<h3 id="openDate"></h3>

<div id="countdown"></div>

<p>📦 Kapsula ID:</p>

<div class="id" id="capsuleId"></div>

</div>

</div>

<script>

document.getElementById("createButton").onclick = function () {

  var message = document.getElementById("message").value;
  var date = document.getElementById("date").value;

  if (message.trim() === "") {
    alert("Avval xat yozing!");
    return;
  }

  if (date === "") {
    alert("Avval sana tanlang!");
    return;
  }

  var target = new Date(date + "T00:00:00").getTime();
  var now = new Date().getTime();

  if (target <= now) {
    alert("Kelajakdagi sanani tanlang!");
    return;
  }

  var id = "TC-" + Math.random().toString(36).substring(2, 8).toUpperCase();

  document.getElementById("create").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  document.getElementById("openDate").innerText = date;
  document.getElementById("capsuleId").innerText = id;

  function countdown() {

    var now = new Date().getTime();
    var difference = target - now;

    if (difference <= 0) {
      document.getElementById("countdown").innerText =
        "🎉 Kapsula ochildi!";
      return;
    }

    var days = Math.floor(difference / 86400000);
    var hours = Math.floor((difference % 86400000) / 3600000);
    var minutes = Math.floor((difference % 3600000) / 60000);
    var seconds = Math.floor((difference % 60000) / 1000);

    document.getElementById("countdown").innerText =
      "⏳ " + days + " kun " +
      hours + " soat " +
      minutes + " daqiqa " +
      seconds + " soniya";
  }

  countdown();
  setInterval(countdown, 1000);
};

</script>

</body>
</html>
